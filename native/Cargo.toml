[package]
name = "starmemory-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
tantivy = "0.26"
tantivy-jieba = "0.20"
usearch = "2.26"
heed = "0.22"
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
opt-level = 3
