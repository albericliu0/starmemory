[package]
name = "starmemory-native"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
tantivy = "0.26"
tantivy-jieba = "0.20"
# default-features = false drops numkong (usearch's SIMD kernels). Its build
# script hard-fails on compilers that do not know the newest x86 flags, which
# includes ubuntu-22.04's gcc, and at this corpus size the portable distance
# code is not measurably slower. Design doc windows-support §05.
usearch = { version = "2.26", default-features = false }
heed = "0.22"
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
libc = "0.2"

[profile.release]
lto = true
opt-level = 3
